<svg width="100%" viewBox="0 0 900 890" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','Consolas','Menlo',monospace" role="img">
<title>KisanCall animated system architecture</title>
<desc>Farmer phone connects to mobile app and staff dashboard, both feeding into the KisanCall backend, which fans out to Supabase, the voice AI pipeline, and the event and proof builder anchoring to AgroChain. data.gov.in feeds live prices up into Supabase. Lines pulse to show live data flow.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="0" y="0" width="900" height="890" fill="#0d1117"/>

<!-- connectors (drawn first, animated flowing dashes) -->
<g fill="none" stroke="#30363d" stroke-width="2">
<path d="M450,110 L450,140 L270,140 L270,170" marker-end="url(#arrow)"/>
<path d="M450,110 L450,140 L630,140 L630,170" marker-end="url(#arrow)"/>
<path d="M420,215 L480,215" marker-end="url(#arrow)"/>
<path d="M480,215 L420,215" marker-end="url(#arrow)"/>
<path d="M270,260 L270,300 L320,300 L320,330" marker-end="url(#arrow)"/>
<path d="M630,260 L630,300 L580,300 L580,330" marker-end="url(#arrow)"/>
<path d="M450,440 L450,480 L170,480 L170,520" marker-end="url(#arrow)"/>
<path d="M450,440 L450,520" marker-end="url(#arrow)"/>
<path d="M450,440 L450,480 L730,480 L730,520" marker-end="url(#arrow)"/>
<path d="M175,760 L175,650" marker-end="url(#arrow)"/>
</g>

<g fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="7,9" opacity="0.9">
<path d="M450,110 L450,140 L270,140 L270,170"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.3s" repeatCount="indefinite"/></path>
<path d="M450,110 L450,140 L630,140 L630,170"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.5s" repeatCount="indefinite"/></path>
<path d="M270,260 L270,300 L320,300 L320,330"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/></path>
<path d="M630,260 L630,300 L580,300 L580,330"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/></path>
<path d="M450,440 L450,480 L170,480 L170,520"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/></path>
<path d="M450,440 L450,520"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.1s" repeatCount="indefinite"/></path>
<path d="M450,440 L450,480 L730,480 L730,520"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.7s" repeatCount="indefinite"/></path>
<path d="M175,760 L175,650"><animate attributeName="stroke-dashoffset" from="0" to="32" dur="1.3s" repeatCount="indefinite"/></path>
</g>

<!-- traveling packet dots -->
<circle r="4" fill="#58a6ff">
<animateMotion dur="2.6s" repeatCount="indefinite" path="M450,110 L450,140 L270,140 L270,170 L270,260 L270,300 L320,300 L320,330"/>
</circle>
<circle r="4" fill="#bc8cff">
<animateMotion dur="2.2s" repeatCount="indefinite" path="M450,330 L450,440 L450,520"/>
</circle>
<circle r="4" fill="#d29922">
<animateMotion dur="2s" repeatCount="indefinite" path="M175,760 L175,650"/>
</circle>

<!-- glow behind farmer phone (entry point) -->
<circle cx="450" cy="75" r="120" fill="url(#glow)">
<animate attributeName="r" values="110;135;110" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- Farmer Phone -->
<g>
<rect x="280" y="40" width="340" height="70" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="450" y="65" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Farmer Phone</text>
<text x="450" y="86" text-anchor="middle" fill="#8b949e" font-size="12">AI Voice &#183; SMS fallback</text>
</g>

<!-- Mobile App -->
<g>
<rect x="120" y="170" width="300" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="270" y="200" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Mobile App</text>
<text x="270" y="222" text-anchor="middle" fill="#8b949e" font-size="12">Expo (React Native)</text>
<text x="270" y="242" text-anchor="middle" fill="#8b949e" font-size="12">register &#183; slot &#183; queue &#183; status</text>
</g>

<!-- Staff Dashboard -->
<g>
<rect x="480" y="170" width="300" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
<text x="630" y="200" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="700">Staff Dashboard</text>
<text x="630" y="222" text-anchor="middle" fill="#8b949e" font-size="12">Next.js + Tailwind</text>
<text x="630" y="242" text-anchor="middle" fill="#8b949e" font-size="12">queue &#183; payments &#183; call console</text>
</g>

<!-- Backend -->
<g>
<rect x="225" y="330" width="450" height="110" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
<text x="450" y="362" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">KisanCall Backend</text>
<text x="450" y="384" text-anchor="middle" fill="#8b949e" font-size="12">Node.js / Fastify API</text>
<text x="450" y="404" text-anchor="middle" fill="#8b949e" font-size="12">Auth &#183; Business Rules &#183; Voice Tool Layer</text>
</g>

<!-- Supabase -->
<g>
<rect x="40" y="520" width="260" height="130" rx="10" fill="#161b22" stroke="#39d3bb" stroke-width="1.5"/>
<text x="170" y="550" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Supabase</text>
<text x="170" y="570" text-anchor="middle" fill="#8b949e" font-size="12">PostgreSQL + pgvector</text>
<text x="170" y="596" text-anchor="middle" fill="#8b949e" font-size="12">farmers &#183; slots</text>
<text x="170" y="614" text-anchor="middle" fill="#8b949e" font-size="12">queue &#183; payments</text>
</g>

<!-- Voice AI Pipeline -->
<g>
<rect x="320" y="520" width="260" height="130" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
<text x="450" y="550" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Voice AI Pipeline</text>
<text x="450" y="570" text-anchor="middle" fill="#8b949e" font-size="12">Groq &#183; Deepgram</text>
<text x="450" y="596" text-anchor="middle" fill="#8b949e" font-size="12">STT &#8594; LLM &#8594; TTS</text>
<text x="450" y="614" text-anchor="middle" fill="#8b949e" font-size="12">streaming, barge-in</text>
</g>

<!-- Event & Proof Builder -->
<g>
<rect x="600" y="520" width="260" height="130" rx="10" fill="#161b22" stroke="#ff7b72" stroke-width="1.5"/>
<text x="730" y="550" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Event &amp; Proof Builder</text>
<text x="730" y="572" text-anchor="middle" fill="#8b949e" font-size="12">hash &#183; anchor &#183; verify</text>
<text x="730" y="598" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700">AgroChain</text>
<text x="730" y="616" text-anchor="middle" fill="#8b949e" font-size="12">Shardeum testnet</text>
</g>

<!-- data.gov.in -->
<g>
<rect x="40" y="760" width="280" height="90" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<text x="180" y="790" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">data.gov.in</text>
<text x="180" y="812" text-anchor="middle" fill="#8b949e" font-size="12">Agmarknet</text>
<text x="180" y="830" text-anchor="middle" fill="#8b949e" font-size="12">live daily mandi prices</text>
</g>

</svg>
